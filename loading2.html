<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Montserrat', sans-serif;
    }

    .bg {
      position: absolute;
      inset: 0;
      background-image: url('https://raw.githubusercontent.com/maison3dlaposte-a11y/gmod-loading/main/loading2.png');
      background-size: cover;
      background-position: center;
    }

    /* Ligne "FILE D'ATTENTE : 0/128" */
    .queue-row {
      position: absolute;
      bottom: 4%;
      left: 900px;
      right: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10;
    }

    .queue-label {
      font-size: 2em;
      font-weight: 600;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .queue-value {
      font-size: 1.5em;
      font-weight: 600;
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 0 2px 15px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

<img src="https://raw.githubusercontent.com/maison3dlaposte-a11y/gmod-loading/refs/heads/main/loading2.png" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;">

  <div class="queue-row">
    <span class="queue-label">File d'attente :</span>
    <span class="queue-value" id="queueValue">0/128</span>
  </div>

  <script>
    const SERVER_IP   = "83.143.117.22";
    const SERVER_PORT = 20014;
    const STEAM_KEY   = "TA_CLE_STEAM";
    const REFRESH_MS  = 10000;

    const queueEl = document.getElementById("queueValue");

    async function fetchPlayers() {
      try {
        const url = `https://api.steampowered.com/IGameServersService/GetServerList/v1/?key=${STEAM_KEY}&filter=addr\\${SERVER_IP}:${SERVER_PORT}&limit=1`;
        const res  = await fetch(url);
        const data = await res.json();
        const srv  = data?.response?.servers?.[0];
        if (srv) {
          queueEl.textContent = `${srv.players}/${srv.max_players}`;
        }
      } catch (e) {}
    }

    fetchPlayers();
    setInterval(fetchPlayers, REFRESH_MS);
  </script>

</body>
</html>
