<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
    }

    .bg.active {
      opacity: 1;
    }

  </style>
</head>
<body>
  <img id="bgA" class="bg active" src="assets/solarys-loading-16.jpg" alt="">
  <img id="bgB" class="bg" src="assets/solarys-loading-17.jpg" alt="">
  <img id="bgC" class="bg" src="assets/solarys-loading-18.jpg" alt="">

  <script>
    const screens = ["bgA", "bgB", "bgC"].map(function(id) {
      return document.getElementById(id);
    });

    let filesTotal = 0;
    let filesNeeded = null;
    let currentScreen = 0;

    function showScreen(index) {
      if (index <= currentScreen) return;
      screens[currentScreen].classList.remove("active");
      screens[index].classList.add("active");
      currentScreen = index;
    }

    function checkLoadingProgress() {
      // Wait for both counters: SetFilesTotal may arrive first.
      if (filesTotal <= 0 || filesNeeded === null) return;
      const done = Math.max(0, filesTotal - filesNeeded);
      if (done / filesTotal >= 2 / 3) showScreen(2);
      else if (done / filesTotal >= 1 / 3) showScreen(1);
    }

    window.SetFilesTotal = function(total) {
      const value = Number(total);
      if (!Number.isFinite(value) || value < 0) return;
      filesTotal = value;
      checkLoadingProgress();
    };

    window.SetFilesNeeded = function(needed) {
      const value = Number(needed);
      if (!Number.isFinite(value) || value < 0) return;
      filesNeeded = value;
      checkLoadingProgress();
    };

    window.DownloadingFile = function() {
      checkLoadingProgress();
    };

    window.SetStatusChanged = function() {
      checkLoadingProgress();
    };

    setTimeout(function() { showScreen(1); }, 10000);
    setTimeout(function() { showScreen(2); }, 20000);
  </script>
</body>
</html>
