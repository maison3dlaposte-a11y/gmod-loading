<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: "Montserrat", Arial, sans-serif;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
    }

    .bg.active {
      opacity: 1;
    }

  </style>
</head>
<body>
  <img id="bgA" class="bg active" src="deidara_loading.png" alt="">
  <img id="bgB" class="bg" src="naruto_sasuke_loading.png" alt="">

  <script>
    const FALLBACK_HALF_TIME_MS = 10000;

    const bgA = document.getElementById("bgA");
    const bgB = document.getElementById("bgB");

    let filesTotal = 0;
    let filesNeeded = 0;
    let switched = false;

    function showSecondScreen() {
      if (switched) return;
      switched = true;
      bgA.classList.remove("active");
      bgB.classList.add("active");
    }

    function checkLoadingHalf() {
      if (filesTotal > 0) {
        const done = Math.max(0, filesTotal - filesNeeded);
        if (done / filesTotal >= 0.5) {
          showSecondScreen();
        }
      }
    }

    window.SetFilesTotal = function(total) {
      filesTotal = Number(total) || 0;
      checkLoadingHalf();
    };

    window.SetFilesNeeded = function(needed) {
      filesNeeded = Number(needed) || 0;
      checkLoadingHalf();
    };

    window.DownloadingFile = function() {
      checkLoadingHalf();
    };

    window.SetStatusChanged = function() {
      checkLoadingHalf();
    };

    setTimeout(showSecondScreen, FALLBACK_HALF_TIME_MS);
  </script>
</body>
</html>
