<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
    }

    .bg.active {
      opacity: 1;
    }

  </style>
</head>
<body>
  <img id="bgA" class="bg active" src="assets/solarys-loading-16.jpg" alt="">
  <img id="bgB" class="bg" src="assets/solarys-loading-17.jpg" alt="">
  <img id="bgC" class="bg" src="assets/solarys-loading-18.jpg" alt="">

  <script>
    const screens = ["bgA", "bgB", "bgC"].map(function(id) {
      return document.getElementById(id);
    });

    let currentScreen = Math.floor(Math.random() * screens.length);

    screens.forEach(function(screen, index) {
      screen.classList.toggle("active", index === currentScreen);
    });

    function showScreen(index) {
      if (index === currentScreen) return;
      screens[currentScreen].classList.remove("active");
      screens[index].classList.add("active");
      currentScreen = index;
    }

    // GMod callbacks stay available; the slideshow runs throughout loading.
    window.SetFilesTotal = function() {};
    window.SetFilesNeeded = function() {};
    window.DownloadingFile = function() {};
    window.SetStatusChanged = function() {};

    setInterval(function() {
      // Pick either other screen, so the same image never repeats immediately.
      const offset = 1 + Math.floor(Math.random() * (screens.length - 1));
      showScreen((currentScreen + offset) % screens.length);
    }, 3000);
  </script>
</body>
</html>
