<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion en cours</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Rajdhani', sans-serif;
    }

    /* Image de fond */
    .bg {
      position: absolute;
      inset: 0;
      background-image: url('https://i.imgur.com/9iG7r1c.jpeg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    /* Overlay sombre léger en bas pour lisibilité */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 40%,
        rgba(0,0,0,0.3) 70%,
        rgba(0,0,0,0.55) 100%
      );
      z-index: 1;
    }

    /* Bloc info bas droite */
    .hud {
      position: absolute;
      bottom: 40px;
      right: 60px;
      z-index: 10;
      text-align: right;
    }

    .connexion-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.6em;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 2px;
      line-height: 1;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }

    .connexion-label strong {
      font-weight: 700;
    }

    /* Ligne séparatrice */
    .separator {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.5);
      margin: 8px 0;
    }

    /* FILE D'ATTENTE */
    .queue-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .queue-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.15em;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .queue-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5em;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 2px 15px rgba(0,0,0,0.9);
      min-width: 90px;
      text-align: right;
      transition: color 0.3s ease;
    }

    .queue-value.loading {
      color: rgba(255,255,255,0.4);
    }

    /* Logo bas gauche */
    .logo {
      position: absolute;
      bottom: 35px;
      left: 45px;
      z-index: 10;
      opacity: 0.9;
    }

    .logo img {
      height: 60px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7));
    }

    /* Indicateur d'actualisation discret */
    .refresh-dot {
      position: absolute;
      bottom: 12px;
      right: 62px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.75em;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Animation d'entrée */
    .hud, .logo {
      animation: fadeUp 0.8s ease forwards;
      opacity: 0;
    }

    .logo { animation-delay: 0.3s; }
    .hud  { animation-delay: 0.5s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <!-- Logo bas gauche -->
  <div class="logo">
    <!-- Remplace par ton logo si besoin : <img src="logo.png"> -->
  </div>

  <!-- HUD bas droite -->
  <div class="hud">
    <div class="connexion-label">Connexion <strong>en cours</strong></div>
    <div class="separator"></div>
    <div class="queue-row">
      <span class="queue-label">File d'attente :</span>
      <span class="queue-value loading" id="queueValue">--/--</span>
    </div>
  </div>

  <!-- Point de rafraîchissement -->
  <div class="refresh-dot">
    <div class="dot"></div>
    <span id="refreshLabel">actualisation...</span>
  </div>

  <script>
    // =============================================
    //  CONFIGURATION — modifie ces valeurs
    // =============================================
    const SERVER_IP   = "TON_IP";      // ex: "123.456.789.0"
    const SERVER_PORT = 27015;          // ton port GMod
    const STEAM_KEY   = "TA_CLE_STEAM"; // clé API Steam (store.steampowered.com/dev/apikey)
    const REFRESH_MS  = 10000;          // actualisation toutes les 10 secondes
    // =============================================

    const queueEl   = document.getElementById("queueValue");
    const refreshEl = document.getElementById("refreshLabel");

    async function fetchPlayers() {
      refreshEl.textContent = "actualisation...";
      try {
        // L'API Steam nécessite un proxy CORS en production.
        // Si tu héberges sur ton propre serveur web, utilise un petit proxy PHP (voir commentaire bas de page).
        const url = `https://api.steampowered.com/IGameServersService/GetServerList/v1/?key=${STEAM_KEY}&filter=addr\\${SERVER_IP}:${SERVER_PORT}&limit=1`;
        const res  = await fetch(url);
        const data = await res.json();
        const srv  = data?.response?.servers?.[0];

        if (srv) {
          const players = srv.players ?? 0;
          const maxPlayers = srv.max_players ?? 128;
          queueEl.textContent = `${players}/${maxPlayers}`;
          queueEl.classList.remove("loading");
        } else {
          queueEl.textContent = "N/A";
        }
      } catch (e) {
        queueEl.textContent = "N/A";
      }
      refreshEl.textContent = "en direct";
    }

    // Lancer au chargement puis toutes les REFRESH_MS
    fetchPlayers();
    setInterval(fetchPlayers, REFRESH_MS);
  </script>

  <!--
  ================================================================
  PROXY PHP (si l'API Steam bloque les requêtes CORS côté client)
  Crée un fichier proxy.php sur ton hébergement web :

  <?php
    header("Access-Control-Allow-Origin: *");
    $key  = "TA_CLE_STEAM";
    $ip   = $_GET['ip'];
    $port = $_GET['port'];
    $url  = "https://api.steampowered.com/IGameServersService/GetServerList/v1/?key=$key&filter=addr\\$ip:$port&limit=1";
    echo file_get_contents($url);
  ?>

  Et change la fetch() ci-dessus en :
  const url = `proxy.php?ip=${SERVER_IP}&port=${SERVER_PORT}`;
  ================================================================
  -->

</body>
</html>
