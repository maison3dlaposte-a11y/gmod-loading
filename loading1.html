<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /* Image de fond = ton PNG complet */
    .bg {
      position: absolute;
      inset: 0;
      background-image: url('https://i.imgur.com/HLjyhT8.jpeg');
      background-size: cover;
      background-position: center;
    }

    /*
      Chiffres dynamiques superposés sur le "0/128" de ton PNG.
      Ajuste bottom/right pour coller parfaitement à ton image.
    */
    .queue-value {
      position: absolute;
      bottom: 11%;   /* ← monte/descend */
      right: 5%;     /* ← gauche/droite */
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.8em;
      color: #ffffff;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <span class="queue-value" id="queueValue">0/128</span>

  <script>
    // =============================================
    //  CONFIGURATION
    // =============================================
    const SERVER_IP   = "TON_IP";       // ex: "123.456.789.0"
    const SERVER_PORT = 27015;
    const STEAM_KEY   = "TA_CLE_STEAM"; // steamcommunity.com/dev/apikey
    const REFRESH_MS  = 10000;          // actualisation toutes les 10s
    // =============================================

    const queueEl = document.getElementById("queueValue");

    async function fetchPlayers() {
      try {
        const url = `https://api.steampowered.com/IGameServersService/GetServerList/v1/?key=${STEAM_KEY}&filter=addr\\${SERVER_IP}:${SERVER_PORT}&limit=1`;
        const res  = await fetch(url);
        const data = await res.json();
        const srv  = data?.response?.servers?.[0];

        if (srv) {
          queueEl.textContent = `${srv.players}/${srv.max_players}`;
        }
      } catch (e) {
        // En cas d'erreur on garde la dernière valeur affichée
      }
    }

    fetchPlayers();
    setInterval(fetchPlayers, REFRESH_MS);
  </script>

</body>
</html>
